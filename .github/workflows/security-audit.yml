name: Auditoria de seguridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Todos los lunes 06:00 UTC - seguimiento continuo aunque nadie
    # corra el script a mano.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Auditar dependencias (npm + pip-audit)
        run: bash scripts/security-check.sh
