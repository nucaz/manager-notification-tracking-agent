<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DevOps Sidecar{% endblock %} — DevOps Sidecar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/"><i class="bi bi-hdd-network"></i> DevOps Sidecar</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/">Leaderboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/repos">Repositorios</a></li>
        <li class="nav-item"><a class="nav-link" href="/deployments">Despliegues</a></li>
        <li class="nav-item"><a class="nav-link" href="/reportes">Auditoría IA</a></li>
        <li class="nav-item"><a class="nav-link" href="/backups">Respaldos</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container-fluid px-4 pb-5">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
