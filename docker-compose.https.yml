# HTTPS para las dos aplicaciones (opcional). Se suma al docker-compose.yml
# normal; ver el apartado "HTTPS" del README. Para activarlo, en el .env de
# la raiz:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.https.yml
#   APP_PUBLISH=127.0.0.1:18090        # la app ya no se publica a la red
#   SIDECAR_PUBLISH=127.0.0.1:18091    # el sidecar tampoco
#   APP_BASE_URL=https://<nombre o IP del servidor>
#   SIDECAR_PUBLIC_URL=https://{host}:8443
#
# y despues: docker compose up -d
#
# Queda asi:
#   https://<servidor>          aplicacion principal
#   https://<servidor>:8443     DevOps Sidecar
#   http://<servidor>:8090 y :8091 (las direcciones anteriores) y el puerto
#   80 solo redirigen a las de arriba.
services:
  caddy:
    image: caddy:2.10-alpine
    container_name: licencias_https
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${SIDECAR_HTTPS_PORT:-8443}:8443"
      - "${HTTP_PORT:-80}:80"
      - "${APP_OLD_PORT:-8090}:8090"
      - "${SIDECAR_OLD_PORT:-8091}:8091"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Aqui vive la autoridad certificadora interna: si se pierde este
      # volumen, se genera otra y hay que reinstalar su certificado raiz.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - devops-sidecar

volumes:
  caddy_data:
  caddy_config:
